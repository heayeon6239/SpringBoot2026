<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>list</title>
<link rel="stylesheet" th:href="@{/css/reviewWrite.css}">
</head>
<body>
	<h1>리뷰 작성하기</h1>
	<div class="content">
		<form th:action="@{/review/reviewWritePro}" method="post">
			<table width="800" border="1">
				<tbody>
					<tr>
						<td>제목:</td>
						<td>
							<input type="text" name="title"/>
						</td>
					</tr>
					<tr>
						<td>작성자:</td>
						<td>
							<input type="text" name="writer" />
						</td>
					</tr>
					<tr>
						<td>별점:</td>
						<td>
							<select name="rating">
								<option value="5">5점</option>
								<option value="4">4점</option>
								<option value="3">3점</option>
								<option value="2">2점</option>
								<option value="1">1점</option>
							</select>
						</td>
					</tr>
					<tr>
						<td>내용:</td>
						<td>
							<input type="text" name="content"/>
						</td>
					</tr>
					
				</tbody>
			</table>
			<div class="btn-area">
			    <input type="submit" value="저장하기"/>
			    <input type="reset" value="취소"/>
			</div>
		</form>
		
	</div>
</body>
</html>

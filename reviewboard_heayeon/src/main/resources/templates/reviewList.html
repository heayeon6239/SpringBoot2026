<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>list</title>
<link rel="stylesheet" th:href="@{/css/reviewList.css}">
</head>
<body>
	<h1>레스토랑 리뷰</h1>
	<div class="content">
		<h3>전체 평균 별점: <span th:text="${avg}"></span>점</h3>
		<span th:if="${star == 1}">⭐</span>
		<span th:if="${star == 2}">⭐⭐</span>
		<span th:if="${star == 3}">⭐⭐⭐</span>
		<span th:if="${star == 4}">⭐⭐⭐⭐</span>
		<span th:if="${star == 5}">⭐⭐⭐⭐⭐</span>
		<table width="800" border="1">
			<thead>
				<tr>
					<th>번호</th>
					<th>제목</th>
					<th>작성자</th>
					<th>별점</th>
					<th>작성일</th>
					<th>조회수</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="li, stat :${reviewlist}">
					<!-- <td th:text=${li.num}></td> -->
					<!-- 전체 게시글의 번호를 최신순으로 계산하는 공식 -->
					<!-- 전체 게시글 개수 -((현재 페이지 번호 - 1) * 한 화면의 게시글 개수) - 현재글 index 번호 -->
					<td th:text="${ph.totalCnt-((ph.pageNum-1)*ph.pageSize)-stat.index}"></td>
					<td>
						<!-- 주소로 num값을 넘김 -->
						<a class="title" th:href="@{/review/reviewDetail(num=${li.num})}" th:text="${li.title}"></a>
					</td>
					<td th:text=${li.writer}></td>
					<td th:text=${li.rating}></td>
					<td th:text=${li.reg_date}></td>
					<td th:text=${li.viewCount}></td>
				</tr>
			</tbody>
		</table>
		
		<!-- 페이징 화면 -->
		<div class="paging">
			<a th:if="${ph.prev}" th:href="@{/(page=${ph.startPage-1})}">◀</a>
			<!-- 페이지 번호 출력 -->
			<span th:each="i : ${#numbers.sequence(ph.startPage,ph.endPage)}">
				<a th:href="@{/(page=${i})}" th:text="${i}"></a>
			</span>
			<a th:if="${ph.next}" th:href="@{/(page=${ph.endPage+1})}">▶</a>
 		</div>
	</div>
	<a class="btn" th:href="@{/review/reviewwrite}">리뷰 작성하기</a>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="styleSheet" th:href="@{/css/header_footer.css}">
</head>

<body>
	<header th:replace="~{header_footer.html::header}"></header>
	<section>
		<div id="section_wrap">
			<div class="title"><h1>상세 게시글</h1></div>
			<Form th:action="@{/board/boardContfirm}" name="boardForm" method="POST">
				<table width="500" border="1" align="center">
					<tbody>
						<tr height="50">
							<td width="150" align="center">제목</td>
							<td width="350" align="center" th:text="${onelist.title}"></td>
						</tr>
						<tr height="50">
							<td width="150" align="center">작성일자</td>
							<td width="350" align="center" th:text="${onelist.createAt}"></td>
						</tr>
						<tr height="50">
							<td width="150" align="center">작성자</td>
							<td width="350" align="center" th:text="${onelist.writer}"></td>
						</tr>
						<tr height="300">
							<td width="150" align="center">내용</td>
							<td width="350" align="center" th:text="${onelist.content}"></td>
						</tr>
					</tbody>
				</table>
				<input type="submit" /> 
				<a th:href="@{/board/boardmodify(id=${onelist.id})}">수정하기</a>
				<a th:href="@{/board/boardremove(id=${onelist.id})}">삭제하기</a>
			</Form>
		</div>
	</section>
	<footer th:replace="~{header_footer.html::footer}"></footer>
</body>
</html>

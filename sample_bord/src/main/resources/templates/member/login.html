<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="styleSheet" th:href="@{/css/header_footer.css}">
<link rel="styleSheet" th:href="@{/css/boardMain.css}">
</head>
<body>
	<header th:replace="~{header_footer.html::header}"></header>
	<section>
		<div id="section_wrap">
			<div class="title"><h1>로그인</h1></div>
			<Form th:action="@{/member/loginPro}" name="login" method="POST">
				<table width="500" border="1">
					<tbody>
						<tr height="50">
							<td width="150" align="center">아이디</td>
							<td width="350" align="center">
								<input type="text" name="id" class="content" placeholder="아이디 입력"/>
							</td>
						</tr>
						<tr height="50">
							<td width="150" align="center">비밀번호</td>
							<td width="350" align="center">
								<input type="password" name="pw" class="content" placeholder="비밀번호 입력"/>
							</td>
						</tr>

						<tr height="50">
							<td colspan="2" align='center'>
								<input type="submit" value="로그인"/>
								<input type="reset" value="취소"/>
							</td>
						</tr>
					</tbody>
				</table>
				<input type="submit" />
			</Form>
		</div>
	</section>
	<footer th:replace="~{header_footer.html::footer}"></footer>
</body>
</html>

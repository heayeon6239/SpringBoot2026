<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<!-- GET(공개)방식으로 주소가 됨, "@{/movie/reserveConfirm}" 주소로 input값들 공유 -->
	<Form th:action="@{/movie/reserveConfirm}" method="GET"> 
		<h2>예매</h2>
		<input type="text" name="movieTitle" placeholder="영화제목"/></br> <!-- name(필드명)으로 Controller에서 값을 저장함 -->
		<input type="Date" name="reserveDate" placeholder="관람날짜"/></br>
		<input type="text" name="reserveTime" placeholder="관람시간"/></br>
		<input type="Number" name="people" placeholder="인원"/></br>
		<input type="text" name="reserverName" placeholder="예약자"/></br>
		<input type="submit" value="reserve"/>
	</Form>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" th:href="@{/css/commom.css}">
<link rel="stylesheet" th:href="@{/css/home.css}">
<link rel="stylesheet" th:href="@{/css/header_nav_footer.css}">
<link rel="stylesheet" th:href="@{/css/member.css}">
<script th:src="@{/js/member.js}"></script>
</head>
<body>
	<header th:replace="~{/include/header_nav_footer.html::header}"></header>
	<nav th:replace="~{/include/header_nav_footer.html::nav}"></nav>
	
	<section>
		<div id="section_wrap">
			<div class="word"><h1>전체 회원 목록</h1></div>
			<div class="content">
				<table border="1">
					<tbody>
						<tr>
							<th>번호</th>
							<th>아이디</th>
							<th>비밀번호</th>
							<th>이메일</th>
							<th>전화번호</th>
							<th>가입일자</th>
							<th>수정일자</th>
						</tr>
						<tr th:each="li: ${list}">
							<td th:text="${li.no}"></td>
							<td>
							<!-- a태그에서 th:href="@{/member/memberInfo(id=${li.id})}" 이렇게 넘기면 무조건 GET방식 !!!! 받을 때 POST면 오류 -->
								<a th:href="@{/member/memberInfo(id=${li.id})}" th:text="${li.id}"></a>
							</td>
							<td th:text="${li.pw}"></td>
							<td th:text="${li.mail}"></td>
							<td th:text="${li.phone}"></td>
							<td th:text="${li.reg_date}"></td>
							<td th:text="${li.mod_date}"></td>
						</tr>
					</tbody>
				</table>
				
			</div>
		</div>
	</section>
	
	<footer th:replace="~{/include/header_nav_footer.html::footer}"></footer>
	
	<Script th:if="${msg}">
		alert('[[${msg}]]');
	</Script>
</body>
</html>

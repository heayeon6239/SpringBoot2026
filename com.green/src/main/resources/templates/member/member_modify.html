<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" th:href="@{/css/commom.css}">
<link rel="stylesheet" th:href="@{/css/home.css}">
<link rel="stylesheet" th:href="@{/css/header_nav_footer.css}">
<link rel="stylesheet" th:href="@{/css/member.css}">
<script th:src="@{/js/member.js}"></script>
</head>
<body>
	<header th:replace="~{/include/header_nav_footer.html::header}"></header>
	<nav th:replace="~{/include/header_nav_footer.html::nav}"></nav>
	
	<section>
		<div id="section_wrap">
			<div class="word"><h1>개인 회원 정보 수정</h1></div>
			<div class="content">
				<Form th:action="@{/member/modify}" method="POST">
					<table border="1">
						<tbody>
							<tr>
								<td>아이디</td>
								<td><input type="text" name="id" th:value="${member.id}" readonly/></td>
								
							</tr>
							<tr>
								<td>이메일</td>
								<td>
									<input type="email" name="mail" th:value="${member.mail}"/>
								</td>
							</tr>
							<tr>
								<td>전화번호</td>
								<td>
									<input type="tel" name="phone" th:value="${member.phone}"/>
								</td>
							</tr>
							<tr>
								<td>비밀번호</td>
								<td>
									<input type="password" name="pw" required placeholder="본인 확인을 위해 반드시 비밀번호를 입력하세요."/>
								</td>
							</tr>
						</tbody>
					</table>
					
						<!-- 버튼 : [회원수정],[목록보기]생성, 다른 주소로 가야하기때문에 a태그 !! -->
					<div class="btn-area">
						<button type="submit" class="btn">회원 수정하기</button>
						<a th:href="@{/member/list}" class="btn">목록보기</a>
					</div>
				</Form>
				
			</div>
		</div>
	</section>
	
	<footer th:replace="~{/include/header_nav_footer.html::footer}"></footer>
	
	<Script th:if="${msg}">
		alert('[[${msg}]]');
	</Script>
</body>
</html>
